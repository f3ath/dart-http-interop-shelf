name: http_interop_shelf
description: Adapts http_interop handlers for use with Shelf.
version: 0.1.0
repository: https://github.com/f3ath/dart-http-interop-shelf

environment:
  sdk: ^3.13.0

dependencies:
    http_interop: ^3.0.0
    shelf: ^1.4.2

dev_dependencies:
  lints: ^6.1.0
  cider: ^0.2.0
  test: ^1.21.1
  check_coverage: ^0.0.2

cider:
  link_template:
    tag: 'https://github.com/f3ath/dart-http-interop-shelf/releases/tag/%tag%'
    diff: 'https://github.com/f3ath/dart-http-interop-shelf/compare/%from%...%to%'
